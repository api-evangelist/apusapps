aid: apusapps
name: apusapps
description: >-
  APUS (apusapps.com) is a global mobile internet company founded in July 2014,
  operating the APUS User System — an Android-based ecosystem of consumer utility
  apps including APUS Launcher, Browser, Booster+, Message Center, Camera, Security
  Elite, Flashlight, and Theme Store. APUS reaches over two billion users across
  more than 200 countries and regions and supports 25+ languages, and was named
  the "world's youngest unicorn" by the Wall Street Journal in 2015. It was surfaced
  as a portfolio company of Qiming Venture Partners and added to the API Evangelist
  network. APUS is a consumer mobile app developer and publishes no public developer
  API, SDK, or documentation surface at this time.
